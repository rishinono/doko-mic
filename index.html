<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="どこでもマイク">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="スマホのマイクの声を、つないだBluetoothスピーカーから出すシンプルなアプリ">
<title>どこでもマイク</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="head">
    <h1>どこでもマイク</h1>
    <p class="status" id="status" role="status" aria-live="polite">停止中。ボタンを押すと話せます</p>
  </header>

  <button id="power" class="power" type="button" aria-pressed="false">
    <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="power-label" id="powerLabel">OFF</span>
    <span class="power-sub" id="powerSub">タップで開始</span>
  </button>

  <section class="panel" aria-labelledby="meterTitle">
    <div class="row between">
      <span id="meterTitle" class="label">声の大きさ</span>
      <span class="hint" id="clipNote"></span>
    </div>
    <div class="meter" aria-hidden="true">
      <div class="meter-bar" id="meterBar"></div>
      <div class="meter-peak" id="meterPeak"></div>
    </div>
  </section>

  <section class="panel">
    <div class="row between">
      <label for="volume" class="label">音量</label>
      <strong id="volumeValue" class="value">100%</strong>
    </div>
    <input type="range" id="volume" min="0" max="300" step="1" value="100" aria-describedby="volScale">
    <div class="scale" id="volScale"><span>0%</span><span>100%</span><span>300%</span></div>
  </section>

  <section class="panel">
    <label class="row between toggle-row">
      <span>
        <span class="label">雑音を減らす</span>
        <span class="hint block">周りのザワザワ音を抑えます（ON/OFFは再接続します）</span>
      </span>
      <input type="checkbox" id="noise" class="toggle">
    </label>
  </section>

  <div id="errorBox" class="error" role="alert" hidden></div>

  <footer class="notes">
    <p>※ Bluetoothは仕組み上、声が少し遅れて出ます。</p>
    <p>※「キーン」と鳴ったら、スピーカーから離れるか音量を下げてください。</p>
    <p>※ 画面を開いたままにしてください。画面を閉じると止まることがあります。</p>
    <p class="install">ホーム画面に追加すると、アプリのように開けて、電波がなくても開けます。</p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
